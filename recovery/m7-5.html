<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>현장점검 관리 대시보드</title><style>*{box-sizing:border-box}body{margin:0;background:#f1f5f9;color:#0f172a;font:16px/1.6 system-ui,sans-serif}header{background:#1e3a8a;color:white;padding:28px max(24px,calc((100vw - 1100px)/2))}header p{margin:4px 0}h1{font-size:26px;margin:0}h2{font-size:20px}main{max-width:1100px;margin:24px auto;padding:0 20px}.card{background:white;border:1px solid #cbd5e1;border-radius:12px;padding:22px;margin-bottom:18px}label{display:block;font-weight:700;margin:12px 0 4px}input,select,textarea,button{font:inherit}input,select,textarea{width:100%;padding:10px;border:1px solid #94a3b8;border-radius:8px}textarea{min-height:90px}button,.button{display:inline-block;background:#0d9488;color:white;padding:10px 18px;border:0;border-radius:8px;cursor:pointer;text-decoration:none}button:focus-visible,a:focus-visible{outline:3px solid #f59e0b;outline-offset:3px}button.secondary{background:#475569}button.danger{background:#be123c;padding:5px 12px}.grid{display:grid;grid-template-columns:1fr 1.5fr;gap:22px}.cards{display:grid;grid-template-columns:1fr 1fr;gap:16px}.muted{color:#475569}.note{background:#e0f2fe;padding:12px;border-radius:8px;font-size:14px}.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.kpis strong{display:block;font-size:32px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:10px;text-align:left;border-bottom:1px solid #e2e8f0;overflow-wrap:anywhere}th{background:#f8fafc}#status{min-height:24px;color:#0f766e}.chart-wrap{max-width:320px;margin:18px auto}#chart{max-height:240px}.legend{display:flex;gap:12px;justify-content:center;font-size:14px}@media(max-width:700px){.grid,.cards{grid-template-columns:1fr}.kpis{gap:8px}.kpis .card{padding:12px}h1{font-size:22px}}</style></head><body><header><p>KOMIR · M7 단계 5/5</p><h1>광해방지시설 현장점검 관리 대시보드</h1></header><main><p class="note">교육용 가상 예시입니다. 실제 공단 규정·시스템이 아니며, 비공개 업무자료와 개인정보를 입력하지 않습니다.</p><p class="note">저장 위치: 현재 PC·브라우저. 같은 폴더와 파일명을 유지하세요. 다른 PC에는 기록이 자동 전달되지 않습니다.</p><p id="status" role="status"></p><section class="kpis"><div class="card">총 점검 건수<strong id="total">0</strong></div><div class="card" style="color:#047857">정상 시설<strong id="normal">0</strong></div><div class="card" style="color:#be123c">주의/긴급 시설<strong id="risk">0</strong></div></section><div class="grid"><form id="entry" class="card"><h2>현장 점검 입력</h2><label for="site">사업소</label><select id="site"><option>정선A시설</option><option>문경B시설</option><option>화순C시설</option><option>태백D시설</option></select><label for="date">점검일자</label><input type="date" id="date" required><label for="inspector">점검자 (가명)</label><input id="inspector" required maxlength="50" placeholder="교육생 A"><label for="state">점검 결과</label><select id="state"><option>정상</option><option>주의</option><option>긴급</option></select><label for="memo">주요 지적사항</label><textarea id="memo" maxlength="2000" placeholder="가상 점검 내용을 입력하세요"></textarea><p><button type="submit">점검 결과 등록</button></p></form><section class="card"><h2>누적 점검 이력</h2><div class="chart-wrap"><canvas id="chart" aria-label="점검 상태 비율" role="img"></canvas><div id="offlineChart" hidden></div><p id="chartStatus" class="muted"></p><div id="legend" class="legend"></div></div><button id="csv">엑셀(CSV) 다운로드</button><div class="table-wrap"><table><thead><tr><th>사업소</th><th>일자</th><th>점검자</th><th>상태</th><th>지적사항</th><th>관리</th></tr></thead><tbody id="rows"></tbody></table></div></section></div></main><script>const key='komir-safety-training-v1';let records=[];const status=document.getElementById('status');try{const saved=JSON.parse(localStorage.getItem(key)||'[]');if(!Array.isArray(saved)||!saved.every(r=>r&&['id','site','date','inspector','state','memo'].every(k=>typeof r[k]==='string')&&['정상','주의','긴급'].includes(r.state)))throw Error('invalid');records=saved;}catch(e){status.textContent='저장된 기록을 읽지 못했습니다. 브라우저 설정을 확인하세요. 이번 입력은 화면에 유지됩니다.'}
function persist(){try{localStorage.setItem(key,JSON.stringify(records));status.textContent='이 브라우저에 저장했습니다.'}catch(e){status.textContent='브라우저 저장이 차단되었습니다. 창을 닫기 전에 기록을 별도로 보관하세요.'}}
function render(){const tbody=document.getElementById('rows');tbody.replaceChildren();for(const r of records){const tr=document.createElement('tr');for(const field of ['site','date','inspector','state','memo']){const td=document.createElement('td');td.textContent=r[field];tr.append(td)}const td=document.createElement('td');const btn=document.createElement('button');btn.textContent='삭제';btn.className='danger';btn.setAttribute('aria-label',r.site+' 점검 삭제');btn.onclick=()=>{records=records.filter(x=>x.id!==r.id);persist();render()};td.append(btn);tr.append(td);tbody.append(tr)}if(!records.length){const tr=document.createElement('tr');const td=document.createElement('td');td.colSpan=6;td.textContent='등록된 점검 이력이 없습니다.';tr.append(td);tbody.append(tr)}document.getElementById('total').textContent=records.length;document.getElementById('normal').textContent=records.filter(r=>r.state==='정상').length;document.getElementById('risk').textContent=records.filter(r=>r.state!=='정상').length;drawChart();}
const today=new Date();document.getElementById('date').value=[today.getFullYear(),String(today.getMonth()+1).padStart(2,'0'),String(today.getDate()).padStart(2,'0')].join('-');document.getElementById('entry').onsubmit=e=>{e.preventDefault();const inspector=document.getElementById('inspector').value.trim();if(!inspector){status.textContent='점검자 가명을 입력하세요.';return}records.push({id:Date.now()+'-'+Math.random().toString(36).slice(2),site:document.getElementById('site').value,date:document.getElementById('date').value,inspector,state:document.getElementById('state').value,memo:document.getElementById('memo').value.trim()});persist();render();document.getElementById('memo').value='';};
let chart;function drawChart(){const labels=['정상','주의','긴급'];const colors=['#16a34a','#f59e0b','#dc2626'];const counts=labels.map(s=>records.filter(r=>r.state===s).length);const total=records.length;document.getElementById('legend').replaceChildren(...labels.map((l,i)=>{const span=document.createElement('span');span.style.color=colors[i];span.textContent=l+' '+(total?(counts[i]/total*100).toFixed(1):'0.0')+'%';return span}));if(window.Chart){document.getElementById('chart').hidden=false;document.getElementById('offlineChart').hidden=true;document.getElementById('chartStatus').textContent='Chart.js · 점검 상태 비율';if(chart){chart.data.datasets[0].data=counts;chart.update()}else{chart=new Chart(document.getElementById('chart'),{type:'doughnut',data:{labels,datasets:[{data:counts,backgroundColor:colors}]},options:{responsive:true,plugins:{legend:{display:false}}}})}}else{document.getElementById('chart').hidden=true;const box=document.getElementById('offlineChart');box.hidden=false;let start=0;const stops=counts.map((n,i)=>{const end=start+(total?n/total*100:0);const stop=colors[i]+' '+start+'% '+end+'%';start=end;return stop});box.style.cssText='width:200px;height:200px;border-radius:50%;margin:auto;display:grid;place-items:center;background:'+(total?'conic-gradient('+stops.join(',')+')':'#e2e8f0');box.replaceChildren();const center=document.createElement('span');center.style.cssText='background:white;border-radius:50%;width:130px;height:130px;display:grid;place-items:center;font-size:24px;font-weight:bold';center.textContent=total+'건';box.append(center);box.setAttribute('role','img');box.setAttribute('aria-label',labels.map((l,i)=>l+' '+counts[i]+'건').join(', '));document.getElementById('chartStatus').textContent='오프라인 대체 차트 · 동일한 집계값';}}
const lib=document.createElement('script');lib.src='https://cdn.jsdelivr.net/npm/chart.js@4.4.9/dist/chart.umd.min.js';lib.onload=drawChart;lib.onerror=()=>{};document.head.append(lib);
function csvCell(value){let text=String(value);if(/^[=+@\-\t\r]/.test(text))text="'"+text;return '"'+text.replace(/"/g,'""')+'"'}document.getElementById('csv').onclick=()=>{const lines=[['사업소','점검일자','점검자','상태','지적사항'],...records.map(r=>[r.site,r.date,r.inspector,r.state,r.memo])];const content='\uFEFF'+lines.map(row=>row.map(csvCell).join(',')).join('\r\n');const url=URL.createObjectURL(new Blob([content],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='광해시설_점검현황_'+document.getElementById('date').value+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
render();</script></body></html>
