<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>스마트 사내 행정 도우미</title><style>*{box-sizing:border-box}body{margin:0;background:#f1f5f9;color:#0f172a;font:16px/1.6 system-ui,sans-serif}header{background:#1e3a8a;color:white;padding:28px max(24px,calc((100vw - 1100px)/2))}header p{margin:4px 0}h1{font-size:26px;margin:0}h2{font-size:20px}main{max-width:1100px;margin:24px auto;padding:0 20px}.card{background:white;border:1px solid #cbd5e1;border-radius:12px;padding:22px;margin-bottom:18px}label{display:block;font-weight:700;margin:12px 0 4px}input,select,textarea,button{font:inherit}input,select,textarea{width:100%;padding:10px;border:1px solid #94a3b8;border-radius:8px}textarea{min-height:90px}button,.button{display:inline-block;background:#0d9488;color:white;padding:10px 18px;border:0;border-radius:8px;cursor:pointer;text-decoration:none}button:focus-visible,a:focus-visible{outline:3px solid #f59e0b;outline-offset:3px}button.secondary{background:#475569}button.danger{background:#be123c;padding:5px 12px}.grid{display:grid;grid-template-columns:1fr 1.5fr;gap:22px}.cards{display:grid;grid-template-columns:1fr 1fr;gap:16px}.muted{color:#475569}.note{background:#e0f2fe;padding:12px;border-radius:8px;font-size:14px}.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.kpis strong{display:block;font-size:32px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:10px;text-align:left;border-bottom:1px solid #e2e8f0;overflow-wrap:anywhere}th{background:#f8fafc}#status{min-height:24px;color:#0f766e}.chart-wrap{max-width:320px;margin:18px auto}#chart{max-height:240px}.legend{display:flex;gap:12px;justify-content:center;font-size:14px}@media(max-width:700px){.grid,.cards{grid-template-columns:1fr}.kpis{gap:8px}.kpis .card{padding:12px}h1{font-size:22px}}@media(max-width:700px){.grid{grid-template-columns:1fr 1.5fr}.cards{grid-template-columns:1fr 1fr}}</style></head><body><header><p>KOMIR · M6 단계 1/5</p><h1>스마트 사내 행정 도우미</h1></header><main><p class="note">교육용 가상 예시입니다. 실제 공단 규정·시스템이 아니며, 비공개 업무자료와 개인정보를 입력하지 않습니다.</p><div class=""><section><label for="search">규정 검색</label><input id="search" placeholder="휴가, 여비 등을 검색하세요" autocomplete="off"><p class="muted">아래 규정과 내선 번호는 실습용 가상 정보입니다.</p><div id="results" class="cards"></div></section></div></main><script>const faqData=[{"title":"경조사 휴가","content":"본인 결혼 5일, 자녀 결혼 1일, 부모 사망 5일"},{"title":"국내 여비 기준","content":"일비 2.5만원, 식비 2.5만원, 숙박비 실비 지원"},{"title":"유연근무제","content":"시차출퇴근제(07시~10시 출근), 코어타임 10:00~15:00"},{"title":"사내 동호회","content":"최소 5인 이상 구성 시 월 활동비 지원"}];const search=document.getElementById('search');function render(){const matches=faqData.filter(x=>(x.title+' '+x.content).includes(search.value.trim()));const box=document.getElementById('results');box.replaceChildren();for(const item of matches){const card=document.createElement('article');card.className='card';const h=document.createElement('h2');h.textContent=item.title;const p=document.createElement('p');p.textContent=item.content;card.append(h,p);box.append(card)}}search.addEventListener('input',render);render();</script></body></html>
