<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>오늘의 업무 다짐 생성기</title><style>*{box-sizing:border-box}body{margin:0;background:#f1f5f9;color:#0f172a;font:16px/1.6 system-ui,sans-serif}header{background:#1e3a8a;color:white;padding:28px max(24px,calc((100vw - 1100px)/2))}header p{margin:4px 0}h1{font-size:26px;margin:0}h2{font-size:20px}main{max-width:1100px;margin:24px auto;padding:0 20px}.card{background:white;border:1px solid #cbd5e1;border-radius:12px;padding:22px;margin-bottom:18px}label{display:block;font-weight:700;margin:12px 0 4px}input,select,textarea,button{font:inherit}input,select,textarea{width:100%;padding:10px;border:1px solid #94a3b8;border-radius:8px}textarea{min-height:90px}button,.button{display:inline-block;background:#0d9488;color:white;padding:10px 18px;border:0;border-radius:8px;cursor:pointer;text-decoration:none}button:focus-visible,a:focus-visible{outline:3px solid #f59e0b;outline-offset:3px}button.secondary{background:#475569}button.danger{background:#be123c;padding:5px 12px}.grid{display:grid;grid-template-columns:1fr 1.5fr;gap:22px}.cards{display:grid;grid-template-columns:1fr 1fr;gap:16px}.muted{color:#475569}.note{background:#e0f2fe;padding:12px;border-radius:8px;font-size:14px}.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.kpis strong{display:block;font-size:32px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:10px;text-align:left;border-bottom:1px solid #e2e8f0;overflow-wrap:anywhere}th{background:#f8fafc}#status{min-height:24px;color:#0f766e}.chart-wrap{max-width:320px;margin:18px auto}#chart{max-height:240px}.legend{display:flex;gap:12px;justify-content:center;font-size:14px}@media(max-width:700px){.grid,.cards{grid-template-columns:1fr}.kpis{gap:8px}.kpis .card{padding:12px}h1{font-size:22px}}</style></head><body><header><p>KOMIR · M5-1 복구 파일</p><h1>오늘의 업무 다짐 생성기</h1></header><main><p class="note">교육용 가상 예시입니다. 실제 공단 규정·시스템이 아니며, 비공개 업무자료와 개인정보를 입력하지 않습니다.</p><section class="card" style="text-align:center;padding:50px 24px"><p class="muted">오늘, 내가 실천할 한 가지</p><h2 id="pledge" aria-live="polite">안전을 먼저 확인하고 업무를 시작하겠습니다.</h2><button id="draw">업무 다짐 뽑기</button></section></main><script>const phrases=['안전을 먼저 확인하고 업무를 시작하겠습니다.','작은 위험도 지나치지 않고 함께 점검하겠습니다.','청렴한 판단으로 신뢰를 지키겠습니다.','반복 업무의 작은 개선부터 실천하겠습니다.','동료와 지식을 나누며 함께 성장하겠습니다.'];let current=0;document.getElementById('draw').onclick=()=>{current=(current+1+Math.floor(Math.random()*(phrases.length-1)))%phrases.length;document.getElementById('pledge').textContent=phrases[current]};</script></body></html>
