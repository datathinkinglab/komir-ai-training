<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>현장점검 관리 대시보드</title><style>*{box-sizing:border-box}body{margin:0;background:#f1f5f9;color:#0f172a;font:16px/1.6 system-ui,sans-serif}header{background:#1e3a8a;color:white;padding:28px max(24px,calc((100vw - 1100px)/2))}header p{margin:4px 0}h1{font-size:26px;margin:0}h2{font-size:20px}main{max-width:1100px;margin:24px auto;padding:0 20px}.card{background:white;border:1px solid #cbd5e1;border-radius:12px;padding:22px;margin-bottom:18px}label{display:block;font-weight:700;margin:12px 0 4px}input,select,textarea,button{font:inherit}input,select,textarea{width:100%;padding:10px;border:1px solid #94a3b8;border-radius:8px}textarea{min-height:90px}button,.button{display:inline-block;background:#0d9488;color:white;padding:10px 18px;border:0;border-radius:8px;cursor:pointer;text-decoration:none}button:focus-visible,a:focus-visible{outline:3px solid #f59e0b;outline-offset:3px}button.secondary{background:#475569}button.danger{background:#be123c;padding:5px 12px}.grid{display:grid;grid-template-columns:1fr 1.5fr;gap:22px}.cards{display:grid;grid-template-columns:1fr 1fr;gap:16px}.muted{color:#475569}.note{background:#e0f2fe;padding:12px;border-radius:8px;font-size:14px}.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.kpis strong{display:block;font-size:32px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:10px;text-align:left;border-bottom:1px solid #e2e8f0;overflow-wrap:anywhere}th{background:#f8fafc}#status{min-height:24px;color:#0f766e}.chart-wrap{max-width:320px;margin:18px auto}#chart{max-height:240px}.legend{display:flex;gap:12px;justify-content:center;font-size:14px}@media(max-width:700px){.grid,.cards{grid-template-columns:1fr}.kpis{gap:8px}.kpis .card{padding:12px}h1{font-size:22px}}</style></head><body><header><p>KOMIR · M7 단계 2/5</p><h1>광해방지시설 현장점검 관리 대시보드</h1></header><main><p class="note">교육용 가상 예시입니다. 실제 공단 규정·시스템이 아니며, 비공개 업무자료와 개인정보를 입력하지 않습니다.</p><p class="note">저장 위치: 현재 PC·브라우저. 같은 폴더와 파일명을 유지하세요. 다른 PC에는 기록이 자동 전달되지 않습니다.</p><p id="status" role="status"></p><div class="grid"><form id="entry" class="card"><h2>현장 점검 입력</h2><label for="site">사업소</label><select id="site"><option>정선A시설</option><option>문경B시설</option><option>화순C시설</option><option>태백D시설</option></select><label for="date">점검일자</label><input type="date" id="date" required><label for="inspector">점검자 (가명)</label><input id="inspector" required maxlength="50" placeholder="교육생 A"><label for="state">점검 결과</label><select id="state"><option>정상</option><option>주의</option><option>긴급</option></select><label for="memo">주요 지적사항</label><textarea id="memo" maxlength="2000" placeholder="가상 점검 내용을 입력하세요"></textarea><p><button type="submit">점검 결과 등록</button></p></form><section class="card"><h2>누적 점검 이력</h2><div class="table-wrap"><table><thead><tr><th>사업소</th><th>일자</th><th>점검자</th><th>상태</th><th>지적사항</th><th>관리</th></tr></thead><tbody id="rows"></tbody></table></div></section></div></main><script>const key='komir-safety-training-v1';let records=[];const status=document.getElementById('status');try{const saved=JSON.parse(localStorage.getItem(key)||'[]');if(!Array.isArray(saved)||!saved.every(r=>r&&['id','site','date','inspector','state','memo'].every(k=>typeof r[k]==='string')&&['정상','주의','긴급'].includes(r.state)))throw Error('invalid');records=saved;}catch(e){status.textContent='저장된 기록을 읽지 못했습니다. 브라우저 설정을 확인하세요. 이번 입력은 화면에 유지됩니다.'}
function persist(){try{localStorage.setItem(key,JSON.stringify(records));status.textContent='이 브라우저에 저장했습니다.'}catch(e){status.textContent='브라우저 저장이 차단되었습니다. 창을 닫기 전에 기록을 별도로 보관하세요.'}}
function render(){const tbody=document.getElementById('rows');tbody.replaceChildren();for(const r of records){const tr=document.createElement('tr');for(const field of ['site','date','inspector','state','memo']){const td=document.createElement('td');td.textContent=r[field];tr.append(td)}const td=document.createElement('td');const btn=document.createElement('button');btn.textContent='삭제';btn.className='danger';btn.setAttribute('aria-label',r.site+' 점검 삭제');btn.onclick=()=>{records=records.filter(x=>x.id!==r.id);persist();render()};td.append(btn);tr.append(td);tbody.append(tr)}if(!records.length){const tr=document.createElement('tr');const td=document.createElement('td');td.colSpan=6;td.textContent='등록된 점검 이력이 없습니다.';tr.append(td);tbody.append(tr)}}
const today=new Date();document.getElementById('date').value=[today.getFullYear(),String(today.getMonth()+1).padStart(2,'0'),String(today.getDate()).padStart(2,'0')].join('-');document.getElementById('entry').onsubmit=e=>{e.preventDefault();const inspector=document.getElementById('inspector').value.trim();if(!inspector){status.textContent='점검자 가명을 입력하세요.';return}records.push({id:Date.now()+'-'+Math.random().toString(36).slice(2),site:document.getElementById('site').value,date:document.getElementById('date').value,inspector,state:document.getElementById('state').value,memo:document.getElementById('memo').value.trim()});persist();render();document.getElementById('memo').value='';};


render();</script></body></html>
